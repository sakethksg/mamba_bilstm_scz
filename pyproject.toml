[project]
name = "mamba-bilstm-scz"
version = "0.1.0"
description = "Pure Mamba-BiLSTM Hybrid Architecture for Schizophrenia Classification from fMRI BOLD Timeseries (Graph-Free)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
